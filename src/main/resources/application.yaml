spring:
  application:
    name: breeze-core
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/breeze_core}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

breeze:
  observability:
    instance-id: ${BREEZE_INSTANCE_ID:local}
  clerk:
    secret-key: ${CLERK_SECRET_KEY:}
    issuer-uri: ${CLERK_ISSUER_URI}
    jwk-set-uri: ${CLERK_JWK_SET_URI}
    allowed-authorized-parties: ${CLERK_ALLOWED_AUTHORIZED_PARTIES}
  outbox:
    worker-threads: ${BREEZE_OUTBOX_WORKER_THREADS:1}
    poll-interval-ms: ${BREEZE_OUTBOX_POLL_INTERVAL_MS:1000}
    lease-seconds: ${BREEZE_OUTBOX_LEASE_SECONDS:60}
    max-attempts: ${BREEZE_OUTBOX_MAX_ATTEMPTS:5}
    retry-base-seconds: ${BREEZE_OUTBOX_RETRY_BASE_SECONDS:5}
  temporal:
    target: ${BREEZE_TEMPORAL_TARGET:localhost:7233}
    namespace: ${BREEZE_TEMPORAL_NAMESPACE:default}
    project-initialization-task-queue: ${BREEZE_TEMPORAL_PROJECT_TASK_QUEUE:breeze-project-initialization}
